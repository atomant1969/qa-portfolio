name: Playwright TypeScript Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: typescript/02-ui-tests
      - run: npx playwright install --with-deps chromium
        working-directory: typescript/02-ui-tests
      - run: npm test
        working-directory: typescript/02-ui-tests
