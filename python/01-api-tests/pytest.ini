[pytest]
addopts = -ra --strict-markers --strict-config --cov=src --cov-report=term-missing --alluredir=allure-results
pythonpath = src
testpaths = tests
markers =
    auth: Authentication and authorization tests
    external: Optional tests against public third-party APIs
    orders: Order API tests
    products: Product API tests
    schema: Response schema validation tests
